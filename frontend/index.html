<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Yemekhane Otomasyonu - Giriş</title>
    <style>
        /* Mobil uyumlu (400px hedefli) temel tasarım */
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #f0f2f5;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .container {
            width: 100%;
            max-width: 400px;
            background: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            box-sizing: border-box;
        }
        h2 {
            text-align: center;
            color: #333;
        }
        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            color: #666;
            font-size: 14px;
        }
        input[type="email"],
        input[type="password"] {
            width: 100%;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 4px;
            box-sizing: border-box;
            font-size: 16px;
        }
        button {
            width: 100%;
            padding: 12px;
            background-color: #0056b3;
            color: white;
            border: none;
            border-radius: 4px;
            font-size: 16px;
            cursor: pointer;
            font-weight: bold;
        }
        button:hover {
            background-color: #004494;
        }
        #hataMesaji {
            color: #dc3545;
            font-size: 14px;
            text-align: center;
            margin-top: 10px;
            display: none;
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>Yemekhane Giriş</h2>
        <form id="girisFormu">
            <div class="form-group">
                <label for="eposta">E-posta</label>
                <input type="email" id="eposta" required>
            </div>
            <div class="form-group">
                <label for="sifre">Şifre</label>
                <input type="password" id="sifre" required>
            </div>
            <button type="submit">Giriş Yap</button>
            <div id="hataMesaji"></div>
        </form>
    </div>

    <script>
        // Form gönderildiğinde çalışacak API isteği (fetch)
        document.getElementById('girisFormu').addEventListener('submit', function(e) {
            e.preventDefault(); // Sayfanın yenilenmesini engelle

            const eposta = document.getElementById('eposta').value;
            const sifre = document.getElementById('sifre').value;
            const hataKutusu = document.getElementById('hataMesaji');
            hataKutusu.style.display = 'none';

            // Apache proxy ayarı gereği /api/ istekleri doğrudan Django'ya yönlendirilecek
            fetch('/api/giris/', { 
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                },
                body: JSON.stringify({ eposta: eposta, sifre: sifre })
            })
            .then(response => {
                if (!response.ok) {
                    throw new Error('E-posta veya şifre hatalı!');
                }
                return response.json();
            })
            .then(data => {
                // Giriş başarılıysa kullanıcı bilgilerini tarayıcıya kaydet
                localStorage.setItem('kullanici_id', data.kullanici.id);
                localStorage.setItem('kullanici_rol', data.kullanici.rol);
                localStorage.setItem('token', data.token);
                
                if (data.kullanici.rol === 'yönetici' || data.kullanici.rol === 'yonetici') {
                    // Yönetici ise doğrudan kendi paneline gitsin
                    window.location.href = 'yonetici-paneli.html';
                } else {
                    // Öğrenci veya personel ise menüye gitsin
                    window.location.href = 'gunun-menusu.html';
                }
            })
            .catch(error => {
                hataKutusu.textContent = error.message;
                hataKutusu.style.display = 'block';
            });
        });
    </script>
</body>
</html>
